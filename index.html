<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동네축구 스쿼드 메이커</title>
  </head>
  <body style="margin:0;background:#0f1420;color:#e8ecf5;font-family:system-ui,'Malgun Gothic',sans-serif">
    <div id="root"></div>

    <!-- 앱이 뜨지 않을 때만(=이 파일을 그냥 더블클릭했을 때만) 나타나는 안내.
         정상 실행 시에는 #root가 채워지므로 표시되지 않습니다. -->
    <div id="not-the-app" hidden>
      <div style="max-width:560px;margin:12vh auto;padding:28px;line-height:1.7">
        <h1 style="font-size:20px;margin:0 0 14px">⚠️ 이 파일은 앱이 아닙니다</h1>
        <p style="color:#93a0b8;margin:0 0 18px">
          이건 빌드할 때 쓰는 <b>빈 템플릿</b>이라, 직접 열면 아무것도 나오지 않습니다.
        </p>
        <p style="margin:0 0 10px"><b>앱을 실행하려면 터미널에서:</b></p>
        <pre style="background:#1e2740;padding:14px;border-radius:8px;overflow-x:auto;margin:0 0 16px"><code>npm install
npm run build</code></pre>
        <p style="color:#93a0b8;margin:0">
          그러면 <b style="color:#4ade80">dist/index.html</b> 이 생깁니다. <b>그 파일</b>을 여세요.<br />
          개발 중이라면 <code style="color:#4ade80">npm run dev</code> 후
          <code>http://localhost:5173</code> 으로 접속하세요.
        </p>
      </div>
    </div>

    <script>
      // React가 1초 안에 #root를 채우지 못하면 = 앱이 실행되지 않은 것
      setTimeout(function () {
        if (!document.getElementById('root').hasChildNodes()) {
          document.getElementById('not-the-app').hidden = false;
        }
      }, 1000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
